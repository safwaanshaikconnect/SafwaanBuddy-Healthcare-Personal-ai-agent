name: Android CI - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SafwaanBuddy_Android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle (fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Build Debug APK
        working-directory: SafwaanBuddy_Android
        run: |
          set -euo pipefail
          if [ -x "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Using project gradlew wrapper"
            ./gradlew :app:assembleDebug --no-daemon
          else
            echo "Gradle wrapper or wrapper JAR missing; using system gradle"
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apks
          path: SafwaanBuddy_Android/app/build/outputs/apk/**/app-*.apk
